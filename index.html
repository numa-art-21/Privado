<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te amo</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #code { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #101720; transition: opacity 2.5s; padding: 16px; box-sizing: border-box; }
  #code.hide { opacity: 0; pointer-events: none; }
  #win { width: min(720px, 100%); }
  .dots span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
  pre { margin: 14px 0 0; color: #1b862d; font: 25px/1.55 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; text-align: left; }
  .cur { display: inline-block; width: 7px; height: 14px; background: #199229; vertical-align: -2px; animation: b 0.8s ease infinite;  }
  @keyframes b { 50% { opacity: 0; } }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; font: 700 clamp(34px, 11vw, 80px) Georgia, "Times New Roman", serif; 
  letter-spacing: 0.3em; /* Empieza muy separado */
  color: #ffd6ea; text-shadow: 0 0 12px #ff3d92, 0 0 34px #ff3d92; filter: blur(12px); /* Empieza difuminado */ }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" viewBox="0 0 600 552">
  <path id="heart" d="M300 530 C120 400 20 300 20 180 C20 80 90 20 170 20 C230 20 275 55 300 110 C325 55 370 20 430 20 C510 20 580 80 580 180 C580 300 480 400 300 530 Z"/>
</svg>
<div id="msg">TE AMO ♥</div>
<div id="code"><div id="win">
  <div class="dots"><span style="background:#ff5f56"></span><span style="background:#ffbd2e"></span><span style="background:#27c93f"></span></div>
  <pre><span id="txt"></span><span class="cur"></span></pre>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const CODE = [
  'const path = document.querySelector("path");',
  'const length = path.getTotalLength();',
  'const vertices = [];',
  'for (let i = 0; i < length; i += 0.1) {',
  '  const point = path.getPointAtLength(i);',
  '  const vector = new THREE.Vector3(point.x, -point.y, 0);',
  '  vector.x += (Math.random() - 0.5) * 30;',
  '  vector.y += (Math.random() - 0.5) * 30;',
  '  vector.z += (Math.random() - 0.5) * 70;',
  '  vertices.push(vector);',
  '  tl.from(vector, {',
  '    x: 600 / 2,',
  '    y: -552 / 2,',
  '    z: 0,',
  '    ease: "power2.inOut",',
  '    duration: "random(2, 5)"',
  '  }, i * 0.002);',
  '}',
  '',
  '// para ti ♥'
].join("\n");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.position.z = Math.max(900, 900 * (0.75 / Math.min(1, camera.aspect)));
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fit();
addEventListener("resize", fit);

const path = document.querySelector("#heart");
const length = path.getTotalLength();
const vertices = [];
const tl = gsap.timeline({ paused: true });
for (let i = 0; i < length; i += 0.2) {
  const p = path.getPointAtLength(i);
  const v = new THREE.Vector3(p.x + (Math.random() - 0.5) * 30, -p.y + (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 70);
  vertices.push(v);
  tl.from(v, { x: 300, y: -276, z: 0, ease: "power2.inOut", duration: gsap.utils.random(2, 5) }, i * 0.002);
}
const positions = new Float32Array(vertices.length * 3);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
const points = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xff6fb0, size: 2.2, transparent: true, opacity: 0.85 }));
points.position.set(-300, 276, 0);
const pivot = new THREE.Group();
pivot.add(points);
scene.add(pivot);

(function animate() {
  requestAnimationFrame(animate);
  for (let i = 0; i < vertices.length; i++) {
    positions[i * 3] = vertices[i].x;
    positions[i * 3 + 1] = vertices[i].y;
    positions[i * 3 + 2] = vertices[i].z;
  }
  geometry.attributes.position.needsUpdate = true;
  pivot.rotation.y = Math.sin(performance.now() / 2500) * 1.35; // movimiento de la camara 

  const t = performance.now() / 3000;
  camera.position.x = Math.sin(t) * 100;  // Se desliza suavemente a los lados
  camera.position.y = Math.cos(t * 3) * 50; // Se eleva y baja levemente
  camera.lookAt(0, 0, 0); // Mantiene la cámara siempre apuntando al centro

  renderer.render(scene, camera);
})();

const codeBox = document.getElementById("code");
const txt = document.getElementById("txt");
const msg = document.getElementById("msg");
let typer = null, busy = false;

function start() {
  clearInterval(typer);
  busy = true;
  tl.pause(0);
  gsap.set(msg, { opacity: 0, scale: 0.9 });
  gsap.killTweensOf(pivot.scale);
  pivot.scale.set(1, 1, 1);
  txt.textContent = "";
  codeBox.classList.remove("hide");
  setTimeout(() => { 
  let n = 0;
  typer = setInterval(() => {
    n += 2;
    txt.textContent = CODE.slice(0, n);
    if (n >= CODE.length) {
      clearInterval(typer);
      setTimeout(() => {
        codeBox.classList.add("hide");
        tl.restart();
        // ANIMACIÓN DEL TEXTO FINAL (Efecto "formándose" como el corazón)
gsap.to(msg, { opacity: 1,scale: 1,letterSpacing: "0.08em", // Las letras se juntan a su espacio normal
  filter: "blur(0px)",     // Se enfoca nítidamente
  duration: 3.5,           // Tiempo que tarda en formarse
  delay: 5, ease: "power3.out" 
});

// Latido continuo del texto una vez formado
gsap.to(msg, { scale: 1.05, duration: 0.6, delay: 8.5, // Empieza justo después de que termina de formarse
  repeat: -1,  yoyo: true, ease: "sine.inOut"});
        busy = false;
      }, 900);
    }
  }, 60);
}, 5000);
}
addEventListener("click", () => { if (!busy) start(); });
start();
</script>
</body>
</html>
