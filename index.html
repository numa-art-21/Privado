<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Te amo</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #code { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #101720; transition: opacity 2.5s; padding: 20px; box-sizing: border-box; z-index: 10; }
  #code.hide { opacity: 0; pointer-events: none; }
  #win { width: 100%; max-width: 600px; }
  .dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  pre { margin: 14px 0 0; color: #1b862d; font: clamp(14px, 4vw, 20px)/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; text-align: left; }
  .cur { display: inline-block; width: 6px; height: 14px; background: #199229; vertical-align: -2px; animation: b 0.8s ease infinite; }
  @keyframes b { 50% { opacity: 0; } }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; font: 700 clamp(28px, 9vw, 70px) Georgia, "Times New Roman", serif; 
  letter-spacing: 0.3em; color: #ffd6ea; text-shadow: 0 0 12px #ff3d92, 0 0 34px #ff3d92; filter: blur(12px); z-index: 5; text-align: center; padding: 0 10px; }
</style>
</head>
<body>

<!-- REPRODUCTOR DE AUDIO: Apunta directamente al archivo mp3 -->
<audio id="bg-music" src="sonido_ba.mp3" loop></audio>
<audio id="bga-music" src="sonido_aca.mp3" loop></audio>

<svg width="0" height="0" style="position:absolute" viewBox="0 0 600 552">
  <path id="heart" d="M300 530 C120 400 20 300 20 180 C20 80 90 20 170 20 C230 20 275 55 300 110 C325 55 370 20 430 20 C510 20 580 80 580 180 C580 300 480 400 300 530 Z"/>
</svg>
<div id="msg">TE AMO VICTORIA ♥ <br>
  FELICES 3 AÑOS JUNTOS
</div>

<div id="code"><div id="win">
  <div class="dots"><span style="background:#ff5f56"></span><span style="background:#ffbd2e"></span><span style="background:#27c93f"></span></div>
  <pre><span id="txt"></span><span class="cur"></span></pre>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const CODE = [
  'const path = document.querySelector("path");',
  'const length = path.getTotalLength();',
  'const vertices = [];',
  'for (let i = 0; i < length; i += 0.1) {',
  '   const point = path.getPointAtLength(i);',
  '   const vector = new THREE.Vector3(point.x, -point.y, 0);',
  '   vector.x += (Math.random() - 0.5) * 30;',
  '   vector.y += (Math.random() - 0.5) * 30;',
  '   vector.z += (Math.random() - 0.5) * 70;',   
  '   vertices.push(vector);',
  '   tl.from(vector, {',
  '     x: 600 / 2,',
  '     y: -552 / 2,',
  '     z: 0,',
  '     ease: "power2.inOut",',
  '     duration: "random(2, 5)"',
  '   }, i * 0.002);',
  '}',
  '',
  '// para ti ♥'
].join("\n");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

function fit() {
  camera.aspect = innerWidth / innerHeight;
  const mobileZoom = innerWidth < 768 ? 1.3 : 0.75;
  camera.position.z = Math.max(900, 900 * (mobileZoom / Math.min(1, camera.aspect)));
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fit();
addEventListener("resize", fit);

const path = document.querySelector("#heart");
const length = path.getTotalLength();
const vertices = [];
const tl = gsap.timeline({ paused: true });
for (let i = 0; i < length; i += 0.2) {
  const p = path.getPointAtLength(i);
  const v = new THREE.Vector3(p.x + (Math.random() - 0.5) * 30, -p.y + (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 70);
  vertices.push(v);
  tl.from(v, { x: 300, y: -276, z: 0, ease: "power2.inOut", duration: gsap.utils.random(2, 5) }, i * 0.002);
}

const positions = new Float32Array(vertices.length * 3);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
const points = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xff6fb0, size: 2.8, transparent: true, opacity: 0.85 }));
points.position.set(-300, 276, 0);
const pivot = new THREE.Group();
pivot.add(points);
scene.add(pivot);

(function animate() {
  requestAnimationFrame(animate);
  for (let i = 0; i < vertices.length; i++) {
    positions[i * 3] = vertices[i].x;
    positions[i * 3 + 1] = vertices[i].y;
    positions[i * 3 + 2] = vertices[i].z;
  }
  geometry.attributes.position.needsUpdate = true;
  pivot.rotation.y = Math.sin(performance.now() / 2500) * 1.35; 

  const t = performance.now() / 3000;
  camera.position.x = Math.sin(t) * 50;  
  camera.position.y = Math.cos(t * 3) * 25; 
  camera.lookAt(0, 0, 0); 

  renderer.render(scene, camera);
})();

const codeBox = document.getElementById("code");
const txt = document.getElementById("txt");
const msg = document.getElementById("msg");
const music = document.getElementById("bg-music");
const music2 = document.getElementById("bga-music");
let typer = null, busy = false;

function start() {
  clearInterval(typer);
  busy = true;
  tl.pause(0);
  music2.pause();
  music.play();
  gsap.set(msg, { opacity: 0, scale: 0.9 });
  gsap.killTweensOf(pivot.scale);
  pivot.scale.set(1, 1, 1);
  txt.textContent = "";
  codeBox.classList.remove("hide");

  setTimeout(() => { 
    let n = 0;
    typer = setInterval(() => {
      n += 2;
      txt.textContent = CODE.slice(0, n);
      if (n >= CODE.length) {
        clearInterval(typer);
        setTimeout(() => {
          codeBox.classList.add("hide");
          tl.restart();
          gsap.to(msg, { 
            opacity: 1, 
            scale: 1, 
            letterSpacing: "0.08em",
            filter: "blur(0px)",    
            duration: 3.5,           
            delay: 5, 
            ease: "power3.out" 
            
          });

          gsap.to(msg, { 
            scale: 1.05, 
            duration: 0.6, 
            delay: 8.5, 
            repeat: -1,  
            yoyo: true, 
            ease: "sine.inOut"
          });
          music.pause();
          music2.play();
          busy = false;
        }, 900);
      }
    }, 50);
  }, 1000); 
}

addEventListener("pointerdown", () => { if (!busy) start(); });
start();
</script>
</body>
</html>
